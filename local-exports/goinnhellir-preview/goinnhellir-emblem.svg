<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" role="img" aria-labelledby="title desc">
  <title id="title">格银西里尔完整徽记</title>
  <desc id="desc">由长矛、树枝、环形轨迹、菱形符印与冰晶结构构成的轻量矢量徽记。</desc>
  <g color="#416b80" fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter">
    <!-- 开放的观测环 -->
    <path d="M48 55C25 68 13 91 13 119c0 35 17 66 45 82" stroke-width="6.4"/>
    <path d="M132 55c23 13 35 36 35 64 0 35-17 66-45 82" stroke-width="6.4"/>

    <!-- 中央长矛与上方导航符 -->
    <path d="M90 5 96 25l-4 5v23" stroke-width="5.2"/>
    <path d="m90 5-6 20 4 5v23" stroke-width="5.2"/>
    <path d="m90 48-29 32M90 48l29 32" stroke-width="6"/>
    <path d="M90 50v54" stroke-width="6"/>
    <path d="m62 84 28 27 28-27" stroke-width="6"/>

    <!-- 对称树枝：寻找与归档 -->
    <g stroke-width="5.4">
      <path d="M58 63v58l18 18"/>
      <path d="m58 80-16-17M58 96 39 78M58 105l16-16"/>
      <path d="M122 63v58l-18 18"/>
      <path d="m122 80 16-17M122 96l19-18M122 105l-16-16"/>
    </g>
    <path d="m39 63 8-7v15M141 63l-8-7v15" stroke-width="4.6"/>

    <!-- 四枚信号叶 -->
    <path d="m67 92-8-3-3-8 8 3 3 8Zm46 0 8-3 3-8-8 3-3 8ZM56 112l-9-2-4-8 9 2 4 8Zm68 0 9-2 4-8-9 2-4 8Z" fill="currentColor" stroke="none"/>

    <!-- 中轴符文 -->
    <g stroke-width="3.8">
      <path d="M88 113v46"/>
      <path d="m88 114 9 9-9 8 9 8-9 8 9 9"/>
    </g>

    <!-- 向内回收的两条轨迹 -->
    <path d="M57 194c-12-9-17-23-14-39 4-19 17-33 33-44-5 20-3 39 2 55" stroke-width="7"/>
    <path d="M123 194c12-9 17-23 14-39-4-19-17-33-33-44 5 20 3 39-2 55" stroke-width="7"/>
    <path d="M65 177v-28l8-18M115 177v-28l-8-18" stroke-width="4.6"/>

    <!-- 核心菱印 -->
    <path d="m90 157 17 18-17 18-17-18 17-18Z" stroke-width="6"/>
    <path d="m90 169 6 6-6 6-6-6 6-6Z" fill="currentColor" stroke="none"/>

    <!-- 下方冰晶 / 回波 -->
    <path d="M90 193v33M69 197l42 29M111 197l-42 29M69 207l-8 8M111 207l8 8M79 219l-8 11M101 219l8 11" stroke-width="5.2"/>
    <path d="M90 226v3" stroke-width="5.2"/>
    <circle cx="90" cy="232" r="7" stroke-width="5.2"/>
    <path d="m45 208 5 5-5 5-5-5 5-5Zm90 0 5 5-5 5-5-5 5-5Z" fill="currentColor" stroke="none"/>
  </g>
</svg>
