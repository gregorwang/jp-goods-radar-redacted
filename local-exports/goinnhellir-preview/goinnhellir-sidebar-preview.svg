<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" role="img" aria-labelledby="title desc">
  <title id="title">格银西里尔侧栏应用预览</title>
  <desc id="desc">完整侧栏与折叠侧栏在实际尺寸下使用新徽记和新导航符号的效果。</desc>
  <defs>
    <linearGradient id="active" x1="0" x2="1">
      <stop offset="0" stop-color="#cfe8e7" stop-opacity=".68"/>
      <stop offset="1" stop-color="#fffefc" stop-opacity="0"/>
    </linearGradient>
    <style>
      .ui { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: Consolas, monospace; }
      .navicon { fill: none; stroke: currentColor; stroke-width: 2.65; stroke-linecap: square; stroke-linejoin: miter; }
      .fine { stroke-width: 1.9; }
      .solid { fill: currentColor; stroke: none; }
    </style>

    <symbol id="emblem" viewBox="0 0 180 240">
      <g fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M48 55C25 68 13 91 13 119c0 35 17 66 45 82M132 55c23 13 35 36 35 64 0 35-17 66-45 82" stroke-width="6.4"/>
        <path d="M90 5 96 25l-4 5v23M90 5l-6 20 4 5v23m2-5L61 80m29-32 29 32M90 50v54M62 84l28 27 28-27" stroke-width="5.6"/>
        <path d="M58 63v58l18 18M58 80 42 63m16 33L39 78m19 27 16-16m48-26v58l-18 18m18-59 16-17m-16 33 19-18m-19 27-16-16" stroke-width="5.4"/>
        <path d="m39 63 8-7v15m94-8-8-7v15" stroke-width="4.6"/>
        <path d="m67 92-8-3-3-8 8 3 3 8Zm46 0 8-3 3-8-8 3-3 8ZM56 112l-9-2-4-8 9 2 4 8Zm68 0 9-2 4-8-9 2-4 8Z" fill="currentColor" stroke="none"/>
        <path d="M88 113v46m0-45 9 9-9 8 9 8-9 8 9 9" stroke-width="3.8"/>
        <path d="M57 194c-12-9-17-23-14-39 4-19 17-33 33-44-5 20-3 39 2 55m45 28c12-9 17-23 14-39-4-19-17-33-33-44 5 20 3 39-2 55" stroke-width="7"/>
        <path d="M65 177v-28l8-18m42 46v-28l-8-18" stroke-width="4.6"/>
        <path d="m90 157 17 18-17 18-17-18 17-18Z" stroke-width="6"/>
        <path d="m90 169 6 6-6 6-6-6 6-6Z" fill="currentColor" stroke="none"/>
        <path d="M90 193v36m-21-32 42 29m0-29-42 29m0-19-8 8m50-8 8 8m-40 4-8 11m30-11 8 11" stroke-width="5.2"/>
        <circle cx="90" cy="232" r="7" stroke-width="5.2"/>
        <path d="m45 208 5 5-5 5-5-5 5-5Zm90 0 5 5-5 5-5-5 5-5Z" fill="currentColor" stroke="none"/>
      </g>
    </symbol>

    <symbol id="overview" viewBox="0 0 48 48"><g class="navicon"><circle cx="24" cy="24" r="18"/><path d="M24 6v8m0-8-3-3m3 3 3-3M24 34v8m0 0-3 3m3-3 3 3M6 24h9m-9 0 3-3m-3 3 3 3m24-3h9m0 0-3-3m3 3-3 3"/><path d="m24 14 10 10-10 10-10-10 10-10Z"/><path d="M24 18v12m0-10 4 4-4 4"/></g></symbol>
    <symbol id="search" viewBox="0 0 48 48"><g class="navicon"><path d="M8 16V8h8M32 8h8v8M8 32v8h8"/><path d="m24 13 12 12-12 12-12-12 12-12Z"/><path d="M31.5 32.5 42 43M35 36l3-3M23 18v14m0-11 7 7v-7"/><path class="solid" d="m17 25 2-2 2 2-2 2-2-2Z"/></g></symbol>
    <symbol id="watches" viewBox="0 0 48 48"><g class="navicon"><path d="M13 5h22v35L24 32 13 40V5Z"/><path class="fine" d="M17 9h14v22l-7-5-7 5V9Z"/><path d="M24 12v15m0-9 6-5m-6 11 6-5m-6 10 3 3-3 3-3-3 3-3Z"/></g></symbol>
    <symbol id="archive" viewBox="0 0 48 48"><g class="navicon"><path d="m7 15 9-8h24l5 6v25l-5 5H9l-4-4V17l2-2Z"/><path d="M7 15h31l7-2M5 24h34l6-5M38 15v28"/><path d="m24 27 6 6-6 6-6-6 6-6ZM24 29v8m0-6 3 3"/></g></symbol>
    <symbol id="signals" viewBox="0 0 48 48"><g class="navicon"><path d="m24 11 6 6-6 6-6-6 6-6ZM24 23v18m-8 5 8-8 8 8M24 3v8m0-8-3 3m3-3 3 3"/><path class="fine" d="M15 12c-5 6-5 13 0 19m18-19c5 6 5 13 0 19M10 8C2 17 3 28 10 36m28-28c8 9 7 20 0 28"/><path d="m21 27 6-5m-6 11 6-5"/></g></symbol>
    <symbol id="analytics" viewBox="0 0 48 48"><g class="navicon"><path d="M7 41h34M10 36V27h7v9m3 0V21h7v15m3 0V14h7v22M8 25l9-10 6 6L38 5m0 0h-8m8 0v8"/><path d="m24 38 3 3-3 3-3-3 3-3Z"/></g></symbol>
    <symbol id="sources" viewBox="0 0 48 48"><g class="navicon"><path d="m24 4 7 7-7 7-7-7 7-7ZM24 18v22M24 24 12 35m12-11 12 11"/><path d="m11 31 6 6-6 6-6-6 6-6Zm26 0 6 6-6 6-6-6 6-6Zm-13 9 4 4-4 4-4-4 4-4Z"/></g></symbol>
  </defs>

  <rect width="760" height="780" fill="#eef3f3"/>
  <text class="ui" x="36" y="38" fill="#18211e" font-size="16" font-weight="600">侧栏实际尺寸预览</text>
  <text class="mono" x="36" y="59" fill="#697873" font-size="10" letter-spacing="1.6">EXPANDED 248 PX / COMPACT 88 PX</text>

  <!-- 展开态 -->
  <g transform="translate(36 80)">
    <rect width="248" height="650" fill="#fffefc" stroke="#18211e" stroke-opacity=".2"/>
    <path d="M0 116h248" stroke="#18211e" stroke-opacity=".1"/>
    <g color="#416b80"><use href="#emblem" x="20" y="26" width="44" height="59"/></g>
    <text class="ui" x="77" y="52" fill="#18211e" font-size="11.5" font-weight="600" letter-spacing=".5">格银西里尔 <tspan font-family="Georgia,serif" font-style="italic" font-weight="600">Goinnhellir</tspan></text>
    <text class="ui" x="77" y="72" fill="#697873" font-size="8.5" letter-spacing="2">日淘商品雷达</text>

    <g class="ui" font-size="13" fill="#596762">
      <g transform="translate(0 135)"><g color="#596762"><use href="#overview" x="34" y="20" width="20" height="20"/></g><text x="84" y="31">今日情报</text><text class="mono" x="84" y="50" font-size="8" letter-spacing="1.5">OVERVIEW</text></g>
      <g transform="translate(0 205)"><g color="#596762"><use href="#search" x="34" y="20" width="20" height="20"/></g><text x="84" y="31">跨站搜索</text><text class="mono" x="84" y="50" font-size="8" letter-spacing="1.5">SEARCH</text></g>
      <g transform="translate(0 275)"><rect width="248" height="70" fill="url(#active)"/><rect width="2" height="70" fill="#416b80"/><g color="#31586d"><use href="#watches" x="34" y="20" width="20" height="20"/></g><text x="84" y="31" fill="#18211e" font-weight="600">关注档案</text><text class="mono" x="84" y="50" font-size="8" letter-spacing="1.5">WATCHES</text></g>
      <g transform="translate(0 345)"><g color="#596762"><use href="#archive" x="34" y="20" width="20" height="20"/></g><text x="84" y="31">商品库</text><text class="mono" x="84" y="50" font-size="8" letter-spacing="1.5">ARCHIVE</text></g>
      <g transform="translate(0 415)"><g color="#596762"><use href="#signals" x="34" y="20" width="20" height="20"/></g><text x="84" y="31">变化与通知</text><text class="mono" x="84" y="50" font-size="8" letter-spacing="1.5">SIGNALS</text></g>
      <g transform="translate(0 485)"><g color="#596762"><use href="#analytics" x="34" y="20" width="20" height="20"/></g><text x="84" y="31">数据分析</text><text class="mono" x="84" y="50" font-size="8" letter-spacing="1.5">ANALYTICS</text></g>
      <g transform="translate(0 555)"><g color="#596762"><use href="#sources" x="34" y="20" width="20" height="20"/></g><text x="84" y="31">来源控制台</text><text class="mono" x="84" y="50" font-size="8" letter-spacing="1.5">SOURCES</text></g>
    </g>
  </g>

  <!-- 折叠态 -->
  <g transform="translate(330 80)">
    <rect width="88" height="650" fill="#fffefc" stroke="#18211e" stroke-opacity=".2"/>
    <path d="M0 116h88" stroke="#18211e" stroke-opacity=".1"/>
    <g color="#416b80"><use href="#emblem" x="22" y="26" width="44" height="59"/></g>
    <g color="#596762">
      <use href="#overview" x="34" y="155" width="20" height="20"/>
      <use href="#search" x="34" y="225" width="20" height="20"/>
      <g><rect y="275" width="88" height="70" fill="url(#active)"/><rect y="275" width="2" height="70" fill="#416b80"/><use href="#watches" x="34" y="295" width="20" height="20" color="#31586d"/></g>
      <use href="#archive" x="34" y="365" width="20" height="20"/>
      <use href="#signals" x="34" y="435" width="20" height="20"/>
      <use href="#analytics" x="34" y="505" width="20" height="20"/>
      <use href="#sources" x="34" y="575" width="20" height="20"/>
    </g>
  </g>

  <!-- 比例说明 -->
  <g transform="translate(470 120)">
    <text class="ui" fill="#18211e" font-size="14" font-weight="600">小尺寸辨识度</text>
    <text class="ui" y="26" fill="#697873" font-size="11">20px 导航符号 · 44px 品牌位</text>
    <g color="#416b80">
      <use href="#watches" x="0" y="58" width="64" height="64"/>
      <use href="#watches" x="104" y="76" width="28" height="28"/>
      <use href="#watches" x="170" y="80" width="20" height="20"/>
    </g>
    <text class="mono" x="12" y="144" fill="#697873" font-size="9">64 PX</text>
    <text class="mono" x="99" y="144" fill="#697873" font-size="9">28 PX</text>
    <text class="mono" x="163" y="144" fill="#697873" font-size="9">20 PX</text>

    <path d="M0 190h230" stroke="#18211e" stroke-opacity=".12"/>
    <text class="ui" y="226" fill="#18211e" font-size="14" font-weight="600">完整徽记</text>
    <text class="ui" y="252" fill="#697873" font-size="11">纯路径 · 无位图纹理</text>
    <g color="#416b80"><use href="#emblem" x="28" y="276" width="144" height="192"/></g>
    <text class="mono" x="30" y="500" fill="#697873" font-size="9" letter-spacing="1">SVG 约 2.3 KB</text>
  </g>
</svg>
