services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jpgr_test
      POSTGRES_USER: jpgr_test
      POSTGRES_PASSWORD: jpgr_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jpgr_test -d jpgr_test"]
      interval: 1s
      timeout: 3s
      retries: 30
