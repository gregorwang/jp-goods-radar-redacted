<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=block">
<style>
html,body{margin:0;background:#fff}
.root{position:relative;width:640px;height:240px;box-sizing:border-box;overflow:hidden;background:#fff;color:#111;font-family:'Noto Serif SC','Songti SC',serif}
.leaf{position:absolute;top:-18px;right:-64px}
.in{position:relative;height:100%;box-sizing:border-box;padding:30px 40px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;font-size:17px;letter-spacing:.14em}
.mark{position:relative;display:inline-block;width:18px;height:18px}
.mark i{position:absolute;width:8px;height:8px;border:0 solid #111}
.mark .a{top:0;left:0;border-top-width:1px;border-left-width:1px}
.mark .b{right:0;bottom:0;border-bottom-width:1px;border-right-width:1px}
.mark .d{top:6px;left:6px;width:6px;height:6px;border-radius:50%;background:#45bfe8}
.eyebrow{font-size:13px;letter-spacing:.2em;color:#4a4a4a}
.head{display:flex;align-items:baseline;font-weight:600}
.key{position:relative;display:inline-block;font-size:76px;line-height:1}
.key .blur{filter:blur(1.8px)}
.key .sharp{position:absolute;left:0;top:0;opacity:.4}
.rest{font-size:48px;line-height:1;letter-spacing:.06em}
.sub{margin:14px 0 0;font-size:15px;line-height:1.6;letter-spacing:.08em;color:#4a4a4a}
</style>
</head>
<body>
<div class="root">
<svg class="leaf" aria-hidden="true" viewBox="0 0 1200 640" width="640" height="341">
<defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter></defs>
<g filter="url(#soft)" fill="#5f7480" fill-opacity="0.11">
<path d="M300 40 C520 120 760 150 1200 60" stroke="#5f7480" stroke-opacity="0.11" stroke-width="10" fill="none"/>
<path d="M640 130 C700 240 760 330 820 420" stroke="#5f7480" stroke-opacity="0.11" stroke-width="8" fill="none"/>
<ellipse cx="360" cy="70" rx="70" ry="26" transform="rotate(-25 360 70)"/>
<ellipse cx="420" cy="130" rx="60" ry="22" transform="rotate(35 420 130)"/>
<ellipse cx="500" cy="80" rx="80" ry="28" transform="rotate(-10 500 80)"/>
<ellipse cx="560" cy="160" rx="66" ry="24" transform="rotate(48 560 160)"/>
<ellipse cx="640" cy="60" rx="90" ry="30" transform="rotate(-18 640 60)"/>
<ellipse cx="700" cy="200" rx="70" ry="24" transform="rotate(62 700 200)"/>
<ellipse cx="760" cy="290" rx="64" ry="22" transform="rotate(30 760 290)"/>
<ellipse cx="820" cy="380" rx="72" ry="26" transform="rotate(70 820 380)"/>
<ellipse cx="860" cy="110" rx="96" ry="34" transform="rotate(-8 860 110)"/>
<ellipse cx="930" cy="200" rx="80" ry="28" transform="rotate(40 930 200)"/>
<ellipse cx="1010" cy="90" rx="100" ry="34" transform="rotate(-20 1010 90)"/>
<ellipse cx="1080" cy="220" rx="90" ry="30" transform="rotate(25 1080 220)"/>
<ellipse cx="1140" cy="320" rx="70" ry="26" transform="rotate(60 1140 320)"/>
<ellipse cx="1000" cy="330" rx="62" ry="22" transform="rotate(-35 1000 330)"/>
<ellipse cx="1110" cy="440" rx="80" ry="26" transform="rotate(45 1110 440)"/>
<ellipse cx="900" cy="300" rx="50" ry="18" transform="rotate(15 900 300)"/>
</g>
</svg>
<div class="in">
<div class="top">
<div class="brand"><span class="mark"><i class="a"></i><i class="b"></i><i class="d"></i></span><span>格银西里尔</span></div>
<span class="eyebrow" id="eyebrow"></span>
</div>
<div>
<div class="head"><span class="key"><span class="blur" id="k1"></span><span class="sharp" id="k2"></span></span><span class="rest" id="rest"></span></div>
<p class="sub" id="sub"></p>
</div>
</div>
</div>
<script>
// 文案与 packages/email/src/design.ts 的 MAIL_HEADERS 一一对应，改一边要改另一边。
var H = {
  "keyword-digest": ["每日行情", "关键词巡回", "按你设的关键词，汇总今天各平台新上架的商品，并附上成交价参考"],
  "keyword-new": ["上新提醒", "关键词上新", "你关注的关键词有新商品上架"],
  "receipt": ["建档回执", "建档完成", "已记下各平台目前在售的商品，从明天起只发新上架的"],
  "exact": ["确认同款", "精确同款雷达", "你指定的那一件出现了，已核对是同一款"],
  "exact-image-hold": ["图片待你看", "精确同款雷达", "这几件标题对上了，但商品图和参考图不同，下单前先看图"],
  "exact-suspect": ["疑似同款", "精确同款雷达", "有几件很接近但还不能确认，每件下面写明了差在哪"],
  "weekly": ["每周汇总", "精确同款周报", "本周所有档案的新同款、降价和到价情况"],
  "item": ["商品变化", "商品雷达", "你在盯的商品有了新变化：降价、补货或到达目标价"],
  "confirm": ["订阅确认", "确认邮箱", "点下面的按钮完成订阅，之后每晚收到一封关键词巡回日报"],
  "confirm-intake": ["登记确认", "确认邮箱", "确认后登记才算提交，结果也会寄到这个邮箱"],
  "login": ["登录", "登录", "点下面的按钮登录，链接 30 分钟内有效"],
  "intake-find": ["找货结果", "找货结果", "你登记的那件，我们找到的在售和已售记录都在下面"],
  "intake-bootleg": ["盗版查询", "盗版查询结果", "你登记的那件，我们查到的结果都在下面"],
  "intake-price": ["行情分析", "行情分析结果", "你登记的那件，近期的在售和成交价格都在下面"]
};
var kind = location.hash.slice(1) || "keyword-digest";
var c = H[kind];
document.getElementById("eyebrow").textContent = c[0];
document.getElementById("k1").textContent = c[1].charAt(0);
document.getElementById("k2").textContent = c[1].charAt(0);
document.getElementById("rest").textContent = c[1].slice(1);
document.getElementById("sub").textContent = c[2];
</script>
</body>
</html>
